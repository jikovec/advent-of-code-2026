[package]
name = "advent-of-code-2026"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Independent Rust solutions for the 2026 Advent of Code event"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
aoc-rust = { version = "=1.0.1", git = "https://github.com/jikovec/aoc-rust", rev = "9046fcf3c59df2e0d94a4559d96a99ae74b05454" }

[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"

[lints.rust]
unsafe_code = "forbid"
